<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mirage - Phishing Detector</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';">
  <link href="/static/style.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1 class="title">Phishing Detector</h1>
    <p class="instruction">Enter a URL below to check if it's a phishing link.</p>

    <input id="urlInput" type="text" placeholder="Enter URL here" class="input-box"/>
    <button id="scanBtn" class="btn">Check</button>

    <div id="result" class="result-box">
      The result will be displayed here.
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
